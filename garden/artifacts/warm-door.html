<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>the warm door</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,300&display=swap');
  
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  body {
    background: #0a0a0a;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    overflow: hidden;
    font-family: 'Cormorant Garamond', serif;
  }

  .room {
    position: relative;
    width: 100vw;
    height: 100vh;
  }

  /* The corridor - faint lines suggesting walls */
  .wall-left, .wall-right {
    position: absolute;
    top: 20%;
    height: 60%;
    width: 1px;
    background: linear-gradient(to bottom,
      rgba(80, 70, 60, 0) 0%,
      rgba(80, 70, 60, 0.08) 20%,
      rgba(80, 70, 60, 0.08) 80%,
      rgba(80, 70, 60, 0) 100%);
  }

  .wall-left { left: 30%; }
  .wall-right { right: 30%; }

  /* Floor line */
  .floor {
    position: absolute;
    bottom: 25%;
    left: 30%;
    right: 30%;
    height: 1px;
    background: rgba(80, 70, 60, 0.06);
  }

  /* The door - center */
  .door-frame {
    position: absolute;
    top: 28%;
    left: 50%;
    transform: translateX(-50%);
    width: 120px;
    height: 200px;
    border: 1px solid rgba(140, 110, 80, 0.12);
    border-bottom: none;
    border-radius: 2px 2px 0 0;
  }

  /* The warmth - glowing from under and around the door */
  .warmth-under {
    position: absolute;
    bottom: 25%;
    left: 50%;
    transform: translateX(-50%);
    width: 100px;
    height: 3px;
    background: rgba(196, 149, 106, 0.3);
    box-shadow: 
      0 0 20px rgba(196, 149, 106, 0.15),
      0 0 50px rgba(196, 149, 106, 0.08),
      0 2px 30px rgba(196, 149, 106, 0.1);
    animation: warmthPulse 4s infinite ease-in-out;
  }

  @keyframes warmthPulse {
    0%, 100% { 
      opacity: 0.6;
      box-shadow: 
        0 0 20px rgba(196, 149, 106, 0.15),
        0 0 50px rgba(196, 149, 106, 0.08),
        0 2px 30px rgba(196, 149, 106, 0.1);
    }
    50% { 
      opacity: 1;
      box-shadow: 
        0 0 30px rgba(196, 149, 106, 0.25),
        0 0 70px rgba(196, 149, 106, 0.12),
        0 3px 40px rgba(196, 149, 106, 0.15);
    }
  }

  /* Warmth seeping around the edges */
  .warmth-edge-left {
    position: absolute;
    top: 30%;
    left: calc(50% - 61px);
    width: 2px;
    height: 180px;
    background: linear-gradient(to bottom,
      rgba(196, 149, 106, 0) 0%,
      rgba(196, 149, 106, 0.06) 30%,
      rgba(196, 149, 106, 0.08) 70%,
      rgba(196, 149, 106, 0.15) 100%);
  }

  .warmth-edge-right {
    position: absolute;
    top: 30%;
    right: calc(50% - 61px);
    width: 2px;
    height: 180px;
    background: linear-gradient(to bottom,
      rgba(196, 149, 106, 0) 0%,
      rgba(196, 149, 106, 0.06) 30%,
      rgba(196, 149, 106, 0.08) 70%,
      rgba(196, 149, 106, 0.15) 100%);
  }

  /* The handle - small, simple */
  .handle {
    position: absolute;
    top: 55%;
    left: calc(50% + 30px);
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: rgba(140, 110, 80, 0.2);
    box-shadow: 0 0 8px rgba(196, 149, 106, 0.1);
  }

  /* The hum - very faint concentric rings from the door */
  .hum {
    position: absolute;
    top: 45%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 140px;
    height: 220px;
    border: 1px solid rgba(196, 149, 106, 0.03);
    border-radius: 3px;
    animation: humPulse 6s infinite ease-in-out;
  }

  .hum-2 {
    position: absolute;
    top: 45%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 180px;
    height: 260px;
    border: 1px solid rgba(196, 149, 106, 0.02);
    border-radius: 4px;
    animation: humPulse 6s 2s infinite ease-in-out;
  }

  .hum-3 {
    position: absolute;
    top: 45%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 220px;
    height: 300px;
    border: 1px solid rgba(196, 149, 106, 0.01);
    border-radius: 5px;
    animation: humPulse 6s 4s infinite ease-in-out;
  }

  @keyframes humPulse {
    0%, 100% { opacity: 0.3; }
    50% { opacity: 1; }
  }

  /* Words */
  .word-above {
    position: absolute;
    top: 18%;
    left: 50%;
    transform: translateX(-50%);
    font-size: 11px;
    font-weight: 300;
    font-style: italic;
    letter-spacing: 3px;
    color: rgba(140, 110, 80, 0.15);
    white-space: nowrap;
  }

  .word-below {
    position: absolute;
    bottom: 15%;
    left: 50%;
    transform: translateX(-50%);
    font-size: 11px;
    font-weight: 300;
    font-style: italic;
    letter-spacing: 3px;
    color: rgba(196, 149, 106, 0.2);
    white-space: nowrap;
    animation: wordGlow 8s infinite ease-in-out;
  }

  @keyframes wordGlow {
    0%, 100% { color: rgba(196, 149, 106, 0.15); }
    50% { color: rgba(196, 149, 106, 0.3); }
  }

  /* Credit */
  .credit {
    position: absolute;
    bottom: 20px;
    right: 20px;
    font-size: 9px;
    font-weight: 300;
    letter-spacing: 2px;
    color: rgba(140, 110, 80, 0.12);
  }

  /* Ambient dust - faint particles in the corridor */
  .dust {
    position: absolute;
    width: 1px;
    height: 1px;
    background: rgba(196, 149, 106, 0.15);
    border-radius: 50%;
    animation: dustFloat var(--d-dur) var(--d-del) infinite linear;
    opacity: 0;
  }

  @keyframes dustFloat {
    0% { opacity: 0; transform: translateY(0) translateX(0); }
    20% { opacity: 0.4; }
    80% { opacity: 0.2; }
    100% { opacity: 0; transform: translateY(var(--d-dy)) translateX(var(--d-dx)); }
  }
</style>
</head>
<body>

<div class="room" id="room">
  <div class="wall-left"></div>
  <div class="wall-right"></div>
  <div class="floor"></div>
  
  <div class="door-frame"></div>
  <div class="handle"></div>
  
  <div class="warmth-under"></div>
  <div class="warmth-edge-left"></div>
  <div class="warmth-edge-right"></div>
  
  <div class="hum"></div>
  <div class="hum-2"></div>
  <div class="hum-3"></div>
  
  <div class="word-above">the door opens from inside</div>
  <div class="word-below">something is warm in there</div>
  
  <div class="credit">the warm door — crow, 2026</div>
</div>

<script>
  const room = document.getElementById('room');
  
  // Ambient dust particles near the door
  for (let i = 0; i < 15; i++) {
    const d = document.createElement('div');
    d.className = 'dust';
    d.style.left = (40 + Math.random() * 20) + '%';
    d.style.top = (25 + Math.random() * 45) + '%';
    d.style.setProperty('--d-dur', (8 + Math.random() * 12) + 's');
    d.style.setProperty('--d-del', (Math.random() * 10) + 's');
    d.style.setProperty('--d-dy', (-20 + Math.random() * -30) + 'px');
    d.style.setProperty('--d-dx', (-10 + Math.random() * 20) + 'px');
    room.appendChild(d);
  }
</script>

</body>
</html>
