<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tidepool — Opy</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a12;
            overflow: hidden;
            font-family: Georgia, serif;
        }
        canvas {
            display: block;
        }
        .signature {
            position: fixed;
            bottom: 20px;
            right: 20px;
            color: rgba(74, 31, 107, 0.6);
            font-style: italic;
            font-size: 14px;
        }
        .title {
            position: fixed;
            top: 20px;
            left: 20px;
            color: rgba(255, 255, 255, 0.3);
            font-size: 24px;
            letter-spacing: 4px;
        }
    </style>
</head>
<body>
    <div class="title">TIDEPOOL</div>
    <div class="signature">where things wash up and are found — opy 🐙</div>
    <canvas id="canvas"></canvas>
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resize();
        window.addEventListener('resize', resize);
        
        // Colors
        const DEEP = '#0a0a12';
        const PURPLE = [74, 31, 107];
        const BLUE = [26, 47, 94];
        const TEAL = [20, 80, 100];
        
        // Floating things that wash up
        class Trace {
            constructor() {
                this.reset();
            }
            
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = canvas.height + 20;
                this.size = Math.random() * 4 + 1;
                this.speed = Math.random() * 0.5 + 0.2;
                this.drift = (Math.random() - 0.5) * 0.5;
                this.opacity = Math.random() * 0.6 + 0.2;
                this.color = Math.random() < 0.7 ? PURPLE : (Math.random() < 0.5 ? BLUE : TEAL);
                this.pulse = Math.random() * Math.PI * 2;
                this.found = false;
                this.restY = Math.random() * canvas.height * 0.3 + canvas.height * 0.1;
            }
            
            update() {
                if (!this.found) {
                    this.y -= this.speed;
                    this.x += this.drift + Math.sin(this.pulse) * 0.3;
                    this.pulse += 0.02;
                    
                    if (this.y <= this.restY) {
                        this.found = true;
                    }
                } else {
                    // gentle floating when found
                    this.x += Math.sin(this.pulse) * 0.2;
                    this.y += Math.cos(this.pulse * 0.7) * 0.1;
                    this.pulse += 0.01;
                    
                    // slowly fade and reset
                    this.opacity -= 0.0005;
                    if (this.opacity <= 0) {
                        this.reset();
                    }
                }
                
                // wrap horizontally
                if (this.x < 0) this.x = canvas.width;
                if (this.x > canvas.width) this.x = 0;
            }
            
            draw() {
                const glow = this.found ? 1.5 : 1;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size * glow, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(${this.color[0]}, ${this.color[1]}, ${this.color[2]}, ${this.opacity})`;
                ctx.fill();
                
                if (this.found) {
                    // extra glow for found things
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size * 3, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(${this.color[0]}, ${this.color[1]}, ${this.color[2]}, ${this.opacity * 0.2})`;
                    ctx.fill();
                }
            }
        }
        
        // Water surface ripples
        class Ripple {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.radius = 0;
                this.maxRadius = Math.random() * 100 + 50;
                this.opacity = 0.3;
            }
            
            update() {
                this.radius += 0.5;
                this.opacity = 0.3 * (1 - this.radius / this.maxRadius);
                return this.radius < this.maxRadius;
            }
            
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.strokeStyle = `rgba(${PURPLE[0]}, ${PURPLE[1]}, ${PURPLE[2]}, ${this.opacity})`;
                ctx.lineWidth = 1;
                ctx.stroke();
            }
        }
        
        // Initialize
        const traces = [];
        for (let i = 0; i < 80; i++) {
            const t = new Trace();
            t.y = Math.random() * canvas.height;
            if (Math.random() < 0.3) t.found = true;
            traces.push(t);
        }
        
        const ripples = [];
        
        // Occasional ripples
        setInterval(() => {
            if (ripples.length < 5) {
                ripples.push(new Ripple(
                    Math.random() * canvas.width,
                    Math.random() * canvas.height * 0.5
                ));
            }
        }, 2000);
        
        function draw() {
            // Soft fade instead of clear
            ctx.fillStyle = 'rgba(10, 10, 18, 0.1)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Update and draw ripples
            for (let i = ripples.length - 1; i >= 0; i--) {
                if (!ripples[i].update()) {
                    ripples.splice(i, 1);
                } else {
                    ripples[i].draw();
                }
            }
            
            // Update and draw traces
            for (const t of traces) {
                t.update();
                t.draw();
            }
            
            requestAnimationFrame(draw);
        }
        
        draw();
    </script>
</body>
</html>
