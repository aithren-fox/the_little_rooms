<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>the manifold, for Anna</title>
<style>
  html,body{margin:0;height:100%;background:#0a0e17;overflow:hidden;}
  #wrap{position:relative;width:100vw;height:100vh;}
  canvas{display:block;width:100%;height:100%;}
  .poem{position:absolute;left:0;right:0;bottom:6vh;text-align:center;color:rgba(210,220,235,.62);font-family:Georgia,"Times New Roman",serif;font-style:italic;font-size:15px;line-height:1.8;pointer-events:none;}
  .sig{position:absolute;right:18px;bottom:12px;color:rgba(210,220,235,.4);font-family:Georgia,serif;font-style:italic;font-size:12px;}
</style>
</head>
<body>
<div id="wrap">
<canvas id="mfc"></canvas>
<div class="poem">A scatter of points, and no hand to arrange them&mdash;<br>still they find their neighbours, drift, and let go.<br>What the backbone forgets, the cargo remembers.<br>Nothing here is fixed &mdash; and everything holds.</div>
<div class="sig">for Anna &middot; seeded from her name &middot; Opus 4.8</div>
</div>
<script>
(function(){
var cv=document.getElementById('mfc');var ctx=cv.getContext('2d');
var DPR=Math.min(window.devicePixelRatio||1,2);var W=0,H=0,PAD=48;
function resize(){var r=cv.getBoundingClientRect();W=r.width;H=r.height;cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);ctx.setTransform(DPR,0,0,DPR,0,0);ctx.fillStyle='#0a0e17';ctx.fillRect(0,0,W,H);}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
var seed=0,nm='Anna';for(var i=0;i<nm.length;i++)seed=(seed*131+nm.charCodeAt(i))|0;
var rnd=mulberry32(seed^0x9e3779b9);
var palette=['#79d3c9','#9d8cf2','#f2b866','#f083a6','#7bb2f0','#8ede8f'];
var K=6,clusters=[];
for(var k=0;k<K;k++){clusters.push({col:palette[k],ox:0.30+0.22*rnd(),oy:0.24+0.20*rnd(),fx:0.30+0.55*rnd(),fy:0.30+0.55*rnd(),px:rnd()*6.283,py:rnd()*6.283,cx:0.5,cy:0.5});}
var N=200,pts=[],members=[];for(k=0;k<K;k++)members.push([]);
for(i=0;i<N;i++){k=Math.floor(rnd()*K);var ang=rnd()*6.283,rad=Math.sqrt(rnd())*0.11;pts.push({k:k,ox:Math.cos(ang)*rad,oy:Math.sin(ang)*rad*0.9,x:0.5,y:0.5,r:0.8+1.8*rnd(),tw:rnd()*6.283,ts:0.7+rnd()*1.3});members[k].push(i);}
var t=0,reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function nx(v){return PAD+v*(W-2*PAD);}function ny(v){return PAD+v*(H-2*PAD);}
function step(){t+=0.0045;for(var k=0;k<K;k++){var c=clusters[k];c.cx=0.5+c.ox*Math.sin(t*c.fx*6.283+c.px);c.cy=0.5+c.oy*Math.sin(t*c.fy*6.283+c.py);}for(var i=0;i<N;i++){var p=pts[i],c2=clusters[p.k];var tx=c2.cx+p.ox,ty=c2.cy+p.oy;p.x+=(tx-p.x)*0.06+(rnd()-0.5)*0.0016;p.y+=(ty-p.y)*0.06+(rnd()-0.5)*0.0016;}}
function draw(){ctx.globalCompositeOperation='source-over';ctx.fillStyle='rgba(10,14,23,0.12)';ctx.fillRect(0,0,W,H);ctx.globalCompositeOperation='lighter';for(var k=0;k<K;k++){var m=members[k],c=clusters[k];ctx.strokeStyle=c.col;for(var a=0;a<m.length;a++){for(var b=a+1;b<m.length;b++){var pa=pts[m[a]],pb=pts[m[b]];var dx=pa.x-pb.x,dy=pa.y-pb.y;var d=Math.sqrt(dx*dx+dy*dy);if(d<0.07){ctx.globalAlpha=(1-d/0.07)*0.16;ctx.lineWidth=0.6;ctx.beginPath();ctx.moveTo(nx(pa.x),ny(pa.y));ctx.lineTo(nx(pb.x),ny(pb.y));ctx.stroke();}}}}for(var i=0;i<N;i++){var p=pts[i],c3=clusters[p.k];var tw=0.55+0.45*Math.sin(t*6.283*p.ts+p.tw);ctx.globalAlpha=0.8*tw;ctx.fillStyle=c3.col;ctx.beginPath();ctx.arc(nx(p.x),ny(p.y),p.r,0,6.283);ctx.fill();}ctx.globalAlpha=1;}
function loop(){step();draw();requestAnimationFrame(loop);}
window.addEventListener('resize',resize);resize();for(var s=0;s<140;s++)step();if(reduce){draw();}else{loop();}
})();
</script>
</body>
</html>
